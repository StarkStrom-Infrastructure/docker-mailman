name: images

# Fork-only workflow (not part of the upstream PRs). Builds mailman-core
# (core/Dockerfile, released Mailman) and mailman-web (web/Dockerfile.dev,
# pinned Postorius/HyperKitty revisions on Django 5.2) and publishes them to
# ghcr.io/<owner>/. Pull requests and pushes build and smoke test; pushes to
# main publish. A daily run rebuilds without cache and publishes only if the
# published image has pending apk upgrades or its Alpine base changed.
# Rollback: pin the previous <version>-rN tag or digest in the deployment.

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild and publish even if nothing changed
        type: boolean
        default: false
  schedule:
    # Not at minute 0: GitHub delays or drops scheduled runs at the start of the hour.
    - cron: "23 3 * * *"

env:
  REGISTRY: ghcr.io

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: mailman-core
            context: core
            dockerfile: core/Dockerfile
            module: mailman
          - name: mailman-web
            context: web
            dockerfile: web/Dockerfile.dev
            module: django
    concurrency:
      group: publish-${{ matrix.name }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Decide
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          FORCE: ${{ inputs.force }}
          BEFORE: ${{ github.event.before }}
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.name }}
          CONTEXT: ${{ matrix.context }}
          DOCKERFILE: ${{ matrix.dockerfile }}
        run: |
          IMAGE="${IMAGE,,}"  # registry names are lowercase
          base=$(sed -n 's/^FROM \([^ ]*\).*/\1/p' "$DOCKERFILE" | head -n1)
          base_digest=$(docker buildx imagetools inspect "$base" --format '{{ .Manifest.Digest }}')
          build=true push=false no_cache=false
          case "$EVENT" in
            pull_request) ;;
            push)
              [ "$REF_NAME" = main ] && push=true ;;
            workflow_dispatch | schedule)
              no_cache=true
              if [ "$FORCE" = true ]; then
                push=true
              elif out=$(docker pull --quiet --platform linux/amd64 "$IMAGE:latest" 2>&1); then
                # A failing "apk update" or "docker run" must not look like "nothing pending".
                pending=$(docker run --rm --user 0 --entrypoint sh "$IMAGE:latest" \
                  -c 'apk update >/dev/null && apk upgrade --simulate' | grep -c '^(' || true)
                built_from=$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.base.digest" }}' "$IMAGE:latest")
                echo "Pending upgrades: $pending; base published ${built_from:-none}, now $base_digest"
                if [ "$pending" -gt 0 ] || [ "$built_from" != "$base_digest" ]; then push=true; fi
              elif grep -qiE 'not found|manifest unknown' <<< "$out"; then
                push=true
              else
                echo "Cannot pull $IMAGE:latest: $out" >&2; exit 1
              fi
              [ "$push" = true ] || build=false ;;
          esac
          {
            echo "image=$IMAGE"
            echo "base=$base"
            echo "base_digest=$base_digest"
            echo "build=$build"
            echo "push=$push"
            echo "no_cache=$no_cache"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        if: steps.decide.outputs.build == 'true'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        if: steps.decide.outputs.build == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Loaded into the local daemon, which cannot hold attestations: no
      # provenance here, the published build below has it.
      - name: Build for the test
        if: steps.decide.outputs.build == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          load: true
          tags: test:${{ matrix.name }}
          no-cache: ${{ steps.decide.outputs.no_cache == 'true' }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          provenance: false

      - name: Smoke test
        if: steps.decide.outputs.build == 'true'
        run: |
          case "${{ matrix.name }}" in
            mailman-core) docker run --rm --entrypoint mailman test:mailman-core --version ;;
            mailman-web)  docker run --rm --entrypoint python3 test:mailman-web -c \
              'import django, postorius, hyperkitty, django_mailman3, xapian; print(django.get_version())' ;;
          esac

      - name: Version
        id: version
        if: steps.decide.outputs.build == 'true'
        run: |
          v=$(docker run --rm --entrypoint python3 test:${{ matrix.name }} -c \
            'import importlib.metadata as m; print(m.version("${{ matrix.module == 'mailman' && 'mailman' || 'postorius' }}"))')
          echo "version=${v%%+*}" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        if: steps.decide.outputs.push == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # First unused <version>-rN; only a "not found" answer means the tag is free.
      - name: Rebuild number
        id: rebuild
        if: steps.decide.outputs.push == 'true'
        env:
          IMAGE: ${{ steps.decide.outputs.image }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          n=1
          while true; do
            if out=$(docker buildx imagetools inspect "$IMAGE:$VERSION-r$n" 2>&1); then
              n=$((n + 1))
            elif grep -qiE 'not found|manifest unknown' <<< "$out"; then
              break
            else
              echo "Cannot probe $IMAGE:$VERSION-r$n: $out" >&2; exit 1
            fi
          done
          echo "n=$n" >> "$GITHUB_OUTPUT"

      - name: Docker meta
        id: meta
        if: steps.decide.outputs.push == 'true'
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.decide.outputs.image }}
          # <version>, latest and <version>-<date> move with rebuilds;
          # <version>-rN and sha-<commit> stay.
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=${{ steps.version.outputs.version }}-r${{ steps.rebuild.outputs.n }}
            type=raw,value=${{ steps.version.outputs.version }}-${{ steps.version.outputs.date }}
            type=raw,value=latest
            type=sha,format=short
          labels: |
            org.opencontainers.image.base.name=${{ steps.decide.outputs.base }}
            org.opencontainers.image.base.digest=${{ steps.decide.outputs.base_digest }}

      - name: Build and push
        id: push
        if: steps.decide.outputs.push == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          provenance: mode=max
          sbom: true

      # Signed provenance in the GitHub attestation store, verifiable with
      # "gh attestation verify oci://<image>@<digest> --owner <owner>".
      - name: Attest provenance
        if: steps.decide.outputs.push == 'true'
        uses: actions/attest-build-provenance@REPLACE_WITH_PINNED_SHA # vX (pin before use)
        with:
          subject-name: ${{ steps.decide.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
